[package]
name = "liburu"
version = "0.1.2"
description = "Lightweight local Markdown project viewer"
authors = ["Codex"]
edition = "2021"

[lib]
name = "md_project_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.8.2", features = [] }
tauri-plugin-dialog = "2.4.1"
walkdir = "2.5.0"
